name: vulkex

on:
  push:
    branches: [vulkex, master]
    paths:
      - 'crates/vulkex/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vulkex.yml'
  pull_request:
    paths:
      - 'crates/vulkex/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vulkex.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  additive:
    name: additive (vulkex excluded from default build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: vulkex is a workspace member but excluded from default-members
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert any(p["name"] == "vulkex" for p in d["packages"]), \
              "vulkex is not a workspace member"
          assert "vulkex" not in d["workspace_default_members"], \
              "vulkex is in default-members; root cargo build would compile shaderc"
          print("ok: member + excluded")
          '

      - name: mistralrs-cli dependency graph has no Vulkan crates
        run: |
          set -euo pipefail
          if cargo tree -p mistralrs-cli --edges normal --prefix none \
               | grep -qE '^(shaderc|shaderc-sys|ash|gpu-allocator) v'; then
            echo "::error::Vulkan crate in mistralrs-cli graph; additive claim is false"
            exit 1
          fi
          echo "ok: no Vulkan crates in the mistralrs-cli graph"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ubuntu-24.04-lint-vulkex

      - name: shaderc-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build python3

      - run: cargo fmt -p vulkex --all -- --check
      - run: cargo clippy -p vulkex --all-targets -- -D warnings

  numerics:
    name: numerics on lavapipe (${{ matrix.os }})
    needs: [additive]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    env:
      # Ubuntu 22.04 loader is 1.3.204; VK_DRIVER_FILES landed in 1.3.234.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      VK_LAYER_KHRONOS_validation_duplicate_message_limit: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: shaderc-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build python3

      - name: Vulkan loader, lavapipe, tools, validation layers
        run: |
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools vulkan-validationlayers

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.os }}-vulkex

      - name: assert lavapipe and validation layer are visible
        run: |
          set -euo pipefail
          vulkaninfo --summary
          vulkaninfo --summary | grep -q 'VK_LAYER_KHRONOS_validation' \
            || { echo "::error::validation layer not enumerated"; exit 1; }
          vulkaninfo --summary | grep -qiE 'llvmpipe|lavapipe|TYPE_CPU' \
            || { echo "::error::lavapipe not enumerated"; exit 1; }
          echo "ok"

      - name: build
        run: cargo build -p vulkex --locked

      - name: gemv numerics
        run: cargo test -p vulkex --test gemv_numerics -- --nocapture

      - name: gemm numerics
        run: cargo test -p vulkex --test gemm_numerics -- --nocapture
